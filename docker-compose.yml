version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: vendor_security_db
    environment:
      POSTGRES_DB: ${DB_NAME:-vendor_security_db}
      POSTGRES_USER: ${DB_USER:-your_db_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change_me_in_production}
    # Do not expose database port to host in production
    # Only accessible internally via Docker network
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/src/config/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-your_db_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend_network
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vendor_security_api
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-vendor_security_db}
      DB_USER: ${DB_USER:-your_db_user}
      DB_PASSWORD: ${DB_PASSWORD:-change_me_in_production}
      JWT_SECRET: ${JWT_SECRET:-change_me_in_production_generate_with_openssl_rand_hex_32}
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/logs:/app/logs
    networks:
      - backend_network
      - frontend_network
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: false

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    container_name: vendor_security_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - frontend_network
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

volumes:
  postgres_data:

networks:
  backend_network:
    name: vendor_security_backend
    driver: bridge
  frontend_network:
    name: vendor_security_frontend
    driver: bridge
